apply plugin: 'com.android.application'

android {
    namespace 'com.hellozh.stopwatch'
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.hellozh.stopwatch"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
}
